<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" />
      <stop offset="0.5" stop-color="#0369a1" />
      <stop offset="1" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="512" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8" />
      <stop offset="1" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- 3D Perspective tracks -->
  <path d="M120 440 L220 300 L292 300 L392 440" stroke="#38bdf8" stroke-width="14" stroke-linecap="round" opacity="0.6" />
  <line x1="160" y1="390" x2="352" y2="390" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.4" />
  <line x1="190" y1="345" x2="322" y2="345" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.4" />

  <!-- Train Body front view -->
  <rect x="146" y="90" width="220" height="230" rx="36" fill="#0f172a" stroke="#38bdf8" stroke-width="12" filter="url(#glow)" />
  <rect x="166" y="115" width="180" height="95" rx="16" fill="#0284c7" opacity="0.85" />
  <rect x="176" y="125" width="160" height="75" rx="10" fill="#38bdf8" opacity="0.3" />

  <!-- Front headlights -->
  <circle cx="196" cy="265" r="18" fill="#facc15" filter="url(#glow)" />
  <circle cx="316" cy="265" r="18" fill="#facc15" filter="url(#glow)" />

  <!-- Destination digital indicator -->
  <rect x="206" y="100" width="100" height="12" rx="4" fill="#38bdf8" />

  <!-- 3D Badge text -->
  <text x="256" y="475" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="28" letter-spacing="4">CHENNAI 3D</text>
</svg>
